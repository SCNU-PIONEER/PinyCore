name: Documentation
description: Report an issue related to https://github.com/SCNU-PIONEER/PinyCore
labels: ["category: documentation"]

body:
- type: markdown
  attributes:
    value: >
      #### Thank you for contributing! Before submitting a doc issue, please make sure it has no duplicate by searching through [the existing and past issues](https://github.com/SCNU-PIONEER/PinyCore/issues?page=1&q=is%3Aissue+sort%3Acreated-desc)

- type: textarea
  attributes:
    label: Describe the doc issue
    description: >
      Please provide a clear and concise description of what content in https://github.com/SCNU-PIONEER/PinyCore is an issue. please specify the branch with the problem.
    placeholder: |
      A clear and concise description of what content in https://github.com/SCNU-PIONEER/PinyCore is an issue.

      Link to the doc: https://github.com/SCNU-PIONEER/PinyCore  
  validations:
    required: true
- type: textarea
  attributes:
    label: Fix suggestion
    description: >
      Tell us how we could improve the documentation in this regard.
