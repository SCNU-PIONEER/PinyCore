name: release
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          release_branches: master
          custom_release_rules: "ci:patch,refactor:patch,chore:patch,docs:patch,style:patch,build:patch,test:patch"
          fetch_all_tags: true

      - name: Debug tag output
        if: steps.tag_version.outputs.new_tag != ''
        run: |
          echo "New tag: ${{ steps.tag_version.outputs.new_tag }}"
          echo "Changelog: ${{ steps.tag_version.outputs.changelog }}"

      - name: Create a GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          generateReleaseNotes: true